<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Archival Ink Radial Background -->
    <radialGradient id="qc-bg" cx="50%" cy="45%" r="55%" fx="48%" fy="42%">
      <stop offset="0%" stop-color="#1E2530"/>
      <stop offset="55%" stop-color="#11161F"/>
      <stop offset="100%" stop-color="#090C10"/>
    </radialGradient>

    <!-- Warm Gold & Amber Gradient for Rims & Accents -->
    <linearGradient id="qc-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Forest / Emerald Multiplex Artery Gradient -->
    <linearGradient id="qc-emerald" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Orbital Encircled Loop Gradient -->
    <linearGradient id="qc-loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Subtle Soft Glow -->
    <filter id="qc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Graceful Lower Arc Path for "QUALICOUNT" typography beneath the tree -->
    <path id="qc-word-path" d="M 115,385 A 195,195 0 0,0 397,385" fill="none" />
  </defs>

  <!-- 1. CIRCULAR BASE & ARCHIVAL BORDERS -->
  <circle cx="256" cy="256" r="250" fill="url(#qc-bg)" />
  <!-- Outer Gold Rim -->
  <circle cx="256" cy="256" r="243" fill="none" stroke="url(#qc-gold)" stroke-width="4.5" />
  <!-- Fine Parchment Ring -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="#FAF8F4" stroke-width="1.2" stroke-opacity="0.35" />
  <!-- Fine Dashed Compass Ring -->
  <circle cx="256" cy="256" r="225" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3 6" stroke-opacity="0.45" />

  <!-- 2. ENCIRCLING LOOP (Tree Diagram Circled by Loop) -->
  <g id="encircling-loop">
    <!-- Dashed Orbital Guidance Loop -->
    <ellipse cx="256" cy="192" rx="172" ry="126" transform="rotate(-14 256 192)"
      fill="none" stroke="#FAF8F4" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.25" />
    <!-- Dynamic Primary Loop Ribbon -->
    <ellipse cx="256" cy="192" rx="168" ry="122" transform="rotate(-14 256 192)"
      fill="none" stroke="url(#qc-loop)" stroke-width="3.5" stroke-linecap="round" filter="url(#qc-glow)" opacity="0.95" />
    <!-- Loop Flow Arrowhead at Upper Right -->
    <polygon points="386,102 404,96 398,114" fill="#F59E0B" />
    <!-- Loop Orbital Satellite Node at Lower Left -->
    <circle cx="106" cy="258" r="5" fill="#38BDF8" stroke="#FAF8F4" stroke-width="1.5" />
  </g>

  <!-- 3. TREE AS A DIAGRAM (Hierarchical Multiplex Partnership Graph) -->
  <g id="tree-diagram">
    <!-- Root Tendrils & Foundation Anchors (y = 298 to 338) -->
    <path d="M 256,298 L 214,332" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 256,298 L 256,338" stroke="#B45309" stroke-width="3" stroke-linecap="round" />
    <path d="M 256,298 L 298,332" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" />
    
    <circle cx="214" cy="332" r="5.5" fill="#FAF8F4" stroke="#B45309" stroke-width="2" />
    <circle cx="256" cy="338" r="6.5" fill="#FAF8F4" stroke="#B45309" stroke-width="2.5" />
    <circle cx="298" cy="332" r="5.5" fill="#FAF8F4" stroke="#B45309" stroke-width="2" />

    <!-- Trunk (Multiplex Upward Arteries) -->
    <path d="M 253,298 L 253,202" stroke="#047857" stroke-width="3.5" />
    <path d="M 259,298 L 259,202" stroke="#FAF8F4" stroke-width="2" stroke-opacity="0.85" />

    <!-- Lower Major Boughs (Green Direct Multiplex Branches) -->
    <path d="M 256,298 Q 198,260 168,208" stroke="url(#qc-emerald)" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 256,298 Q 314,260 344,208" stroke="url(#qc-emerald)" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Cross-Pollination Yellow Referral Bridges (Dashed Multiplex Links) -->
    <path d="M 168,208 Q 212,194 256,202" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 3" fill="none" />
    <path d="M 256,202 Q 300,194 344,208" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 3" fill="none" />
    <path d="M 168,208 Q 256,228 344,208" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" fill="none" stroke-opacity="0.75" />

    <!-- Upper Canopy Branches (Canopy Network Infrastructure) -->
    <!-- From Left Bough (168, 208) -->
    <path d="M 168,208 L 122,148" stroke="url(#qc-emerald)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 168,208 L 166,130" stroke="url(#qc-emerald)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 168,208 L 208,122" stroke="url(#qc-emerald)" stroke-width="2.5" stroke-linecap="round" />

    <!-- From Central Bough (256, 202) -->
    <path d="M 256,202 L 224,110" stroke="url(#qc-emerald)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 256,202 L 256,76" stroke="#FAF8F4" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 256,202 L 288,110" stroke="url(#qc-emerald)" stroke-width="2.5" stroke-linecap="round" />

    <!-- From Right Bough (344, 208) -->
    <path d="M 344,208 L 304,122" stroke="url(#qc-emerald)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 344,208 L 346,130" stroke="url(#qc-emerald)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 344,208 L 390,148" stroke="url(#qc-emerald)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Foliage Perimeter Diagram Arcs (Canopy Network Silhouette) -->
    <path d="M 122,148 Q 142,120 166,130 Q 190,102 208,122 Q 230,82 256,76 Q 282,82 304,122 Q 322,102 346,130 Q 370,120 390,148" 
      stroke="#10B981" stroke-width="2" stroke-dasharray="5 3" fill="none" stroke-opacity="0.75" />

    <!-- Cross Alliances in Canopy -->
    <path d="M 166,130 L 224,110" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="3 3" />
    <path d="M 256,76 L 208,122" stroke="#34D399" stroke-width="1.8" />
    <path d="M 256,76 L 304,122" stroke="#34D399" stroke-width="1.8" />
    <path d="M 346,130 L 288,110" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="3 3" />

    <!-- NODES (Network Junctions & Tokens) -->
    <!-- Root Node (Lead NGO Foundation) -->
    <circle cx="256" cy="298" r="14" fill="#FAF8F4" stroke="#047857" stroke-width="3.5" />
    <circle cx="256" cy="298" r="5.5" fill="#0F6B38" />

    <!-- Tier 1 Bough Nodes -->
    <circle cx="168" cy="208" r="11" fill="#FAF8F4" stroke="#10B981" stroke-width="3" />
    <circle cx="168" cy="208" r="4" fill="#059669" />

    <circle cx="256" cy="202" r="12" fill="#FAF8F4" stroke="#38BDF8" stroke-width="3" />
    <circle cx="256" cy="202" r="4.5" fill="#0284C7" />

    <circle cx="344" cy="208" r="11" fill="#FAF8F4" stroke="#10B981" stroke-width="3" />
    <circle cx="344" cy="208" r="4" fill="#059669" />

    <!-- Tier 2 Canopy Leaf Nodes -->
    <circle cx="122" cy="148" r="8.5" fill="#FAF8F4" stroke="#10B981" stroke-width="2.5" />
    <circle cx="122" cy="148" r="3" fill="#059669" />

    <circle cx="166" cy="130" r="9" fill="#FAF8F4" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="166" cy="130" r="3" fill="#B45309" />

    <circle cx="208" cy="122" r="8" fill="#FAF8F4" stroke="#10B981" stroke-width="2.5" />
    <circle cx="208" cy="122" r="2.5" fill="#059669" />

    <circle cx="224" cy="110" r="8" fill="#FAF8F4" stroke="#34D399" stroke-width="2.5" />
    <circle cx="224" cy="110" r="2.5" fill="#10B981" />

    <circle cx="288" cy="110" r="8" fill="#FAF8F4" stroke="#34D399" stroke-width="2.5" />
    <circle cx="288" cy="110" r="2.5" fill="#10B981" />

    <circle cx="304" cy="122" r="8" fill="#FAF8F4" stroke="#10B981" stroke-width="2.5" />
    <circle cx="304" cy="122" r="2.5" fill="#059669" />

    <circle cx="346" cy="130" r="9" fill="#FAF8F4" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="346" cy="130" r="3" fill="#B45309" />

    <circle cx="390" cy="148" r="8.5" fill="#FAF8F4" stroke="#10B981" stroke-width="2.5" />
    <circle cx="390" cy="148" r="3" fill="#059669" />

    <!-- Crown Apex Summit Node (Apex of Strategic Coalition) -->
    <circle cx="256" cy="76" r="17" fill="none" stroke="url(#qc-gold)" stroke-width="2" stroke-dasharray="3 3" />
    <circle cx="256" cy="76" r="12" fill="#FAF8F4" stroke="#F59E0B" stroke-width="3" />
    <circle cx="256" cy="76" r="4.5" fill="#B45309" />
  </g>

  <!-- 4. TYPOGRAPHY: "QUALICOUNT" BENEATH THE TREE -->
  <g id="brand-typography">
    <!-- Curved Title Along Archival Arc (Baseline dips to y = 445, clear of roots y = 338 and outer rim y = 500) -->
    <text font-family="'Cinzel', Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="6" fill="#FAF8F4" filter="url(#qc-glow)">
      <textPath href="#qc-word-path" startOffset="50%" text-anchor="middle">QUALICOUNT</textPath>
    </text>

    <!-- Subtitle / Version Pill Positioned Cleanly Beneath the Title Arc (y = 472) -->
    <text x="256" y="472" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="3.5" fill="#D97706">
      PARTNERSHIP LEDGER · v2.0
    </text>

    <!-- Decorative Archival Flank Stars -->
    <circle cx="152" cy="469" r="2.2" fill="#F59E0B" />
    <circle cx="360" cy="469" r="2.2" fill="#F59E0B" />
  </g>
</svg>
