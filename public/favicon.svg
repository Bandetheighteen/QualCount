<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="fav-loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Disc -->
  <circle cx="32" cy="32" r="31" fill="#11161F" />
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#fav-gold)" stroke-width="1.8" />
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#FAF8F4" stroke-width="0.8" stroke-opacity="0.35" />

  <!-- Encircling Loop (Tilted Orbit with Arrowhead) -->
  <ellipse cx="32" cy="25.5" rx="22" ry="16" transform="rotate(-14 32 25.5)"
    fill="none" stroke="url(#fav-loop)" stroke-width="1.8" stroke-linecap="round" />
  <polygon points="49,13 52,11 51,15" fill="#F59E0B" />

  <!-- Tree Diagram Edges -->
  <!-- Root to Trunk -->
  <line x1="32" y1="41" x2="32" y2="27" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" />
  <line x1="32" y1="41" x2="25" y2="46" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="41" x2="39" y2="46" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" />

  <!-- Boughs -->
  <path d="M 32,41 Q 23,35 19,27" stroke="#10B981" stroke-width="1.8" fill="none" stroke-linecap="round" />
  <path d="M 32,41 Q 41,35 45,27" stroke="#10B981" stroke-width="1.8" fill="none" stroke-linecap="round" />
  
  <!-- Canopy Edges -->
  <line x1="19" y1="27" x2="13" y2="19" stroke="#10B981" stroke-width="1.5" />
  <line x1="19" y1="27" x2="22" y2="16" stroke="#10B981" stroke-width="1.5" />
  <line x1="32" y1="27" x2="32" y2="9" stroke="#FAF8F4" stroke-width="1.8" />
  <line x1="45" y1="27" x2="42" y2="16" stroke="#10B981" stroke-width="1.5" />
  <line x1="45" y1="27" x2="51" y2="19" stroke="#10B981" stroke-width="1.5" />

  <!-- Canopy Yellow Referral Cross-Bridge -->
  <line x1="22" y1="16" x2="42" y2="16" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="2 2" />

  <!-- Nodes (Vertices) -->
  <!-- Roots -->
  <circle cx="25" cy="46" r="1.5" fill="#FAF8F4" />
  <circle cx="39" cy="46" r="1.5" fill="#FAF8F4" />
  <circle cx="32" cy="41" r="2.8" fill="#FAF8F4" stroke="#047857" stroke-width="1" />
  
  <!-- Boughs -->
  <circle cx="19" cy="27" r="2.2" fill="#FAF8F4" stroke="#10B981" stroke-width="0.8" />
  <circle cx="32" cy="27" r="2.4" fill="#FAF8F4" stroke="#38BDF8" stroke-width="0.8" />
  <circle cx="45" cy="27" r="2.2" fill="#FAF8F4" stroke="#10B981" stroke-width="0.8" />

  <!-- Canopy Nodes -->
  <circle cx="13" cy="19" r="1.8" fill="#FAF8F4" stroke="#10B981" stroke-width="0.6" />
  <circle cx="22" cy="16" r="1.8" fill="#FAF8F4" stroke="#F59E0B" stroke-width="0.6" />
  <circle cx="42" cy="16" r="1.8" fill="#FAF8F4" stroke="#F59E0B" stroke-width="0.6" />
  <circle cx="51" cy="19" r="1.8" fill="#FAF8F4" stroke="#10B981" stroke-width="0.6" />

  <!-- Crown Apex Summit -->
  <circle cx="32" cy="9" r="2.8" fill="#FAF8F4" stroke="#F59E0B" stroke-width="1" />
  <circle cx="32" cy="9" r="1" fill="#B45309" />

  <!-- Word beneath "QUALICOUNT" on bottom arc -->
  <text x="32" y="56.5" text-anchor="middle" fill="#FAF8F4" font-family="'Cinzel', Georgia, serif" font-size="4.8" font-weight="bold" letter-spacing="0.8">QUALICOUNT</text>
</svg>
